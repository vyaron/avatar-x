<html>

<head>
  <title>Avatar Creator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="icon" type="image/x-icon" href="favicon.ico?c=4" />
  <link rel="stylesheet" href="css/main.css" />
</head>

<body onload="game.init()">

  <section class="page avatar-editor-page" hidden>
    <div class="avatar-holder avatar-editor">
      <img data-type="head" data-gender="f" src="img/avatar/head_f1.png" />
      <img data-type="eye" data-gender="f" src="img/avatar/eye_f1.png" />
      <img data-type="hair" data-gender="f"
        src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
      <img data-type="mouth" data-gender="f" src="img/avatar/mouth_f1.png" />
      <img data-type="glasses" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
      <img data-type="accessory" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
      <img data-type="necklace" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
      <img data-type="boa" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" />
    </div>
    <label>
      בן?
      <input name="is-male" type="checkbox" onchange="game.toggleGender(this.checked)" />
    </label>
    <section class="avatar-parts-container"></section>
    <button class="btn" onclick="game.saveAvatar()">שימרי</button>
    <button class="btn" onclick="game.randomAvatar()">על המזל</button>
    <button class="btn" onclick="game.gotoAvatarsPage()">חזרה לרשימה</button>
    <p class="credit">Avatar graphics created by Noble Master Games</p>
    <canvas width="400" height="400" hidden></canvas>
  </section>

  <section class="page avatar-list-page" hidden>
    <ul class="avatar-list"></ul>
    <hr />
    <button class="btn" onclick="game.gotoAvatarEditorPage()">הוסיפי +</button>
  </section>

  <section class="user-msg"></section>

  <script type="module" src="js/app.js"></script>
  <link rel="stylesheet" href="lib/animate.css">
</body>

</html>
